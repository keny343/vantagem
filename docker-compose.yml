# Ambiente de desenvolvimento: Postgres + API + loja.
#
#   docker compose up
#   API   http://localhost:4200
#   Web   http://localhost:5174

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vantagem
      POSTGRES_PASSWORD: vantagem_dev
      POSTGRES_DB: vantagem
    ports:
      - '5434:5432'
    volumes:
      - vantagem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vantagem -d vantagem']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run migrate && npm run seed && npm run dev"
    environment:
      NODE_ENV: development
      PORT: '4200'
      DATABASE_URL: postgresql://vantagem:vantagem_dev@postgres:5432/vantagem
      DATABASE_SSL: 'false'
      CORS_ORIGINS: http://localhost:5174
      SESSION_COOKIE_NAME: vantagem_session
      LOG_LEVEL: info
    ports:
      - '4200:4200'
    volumes:
      - ./backend:/app
      - vantagem_backend_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VANTAGEM_API_TARGET: http://backend:4200
    ports:
      - '5174:5174'
    volumes:
      - ./frontend:/app
      - vantagem_frontend_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  vantagem_pgdata:
  vantagem_backend_modules:
  vantagem_frontend_modules:
