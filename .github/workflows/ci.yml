name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vantagem
          POSTGRES_PASSWORD: vantagem
          POSTGRES_DB: vantagem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vantagem -d vantagem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://vantagem:vantagem@127.0.0.1:5432/vantagem_test
      DATABASE_SSL: 'false'
      LOG_LEVEL: silent
      CSRF_SECRET: ci-csrf-secret-hardening-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vantagem
          POSTGRES_PASSWORD: vantagem
          POSTGRES_DB: vantagem_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vantagem -d vantagem_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      PORT: '4200'
      DATABASE_URL: postgres://vantagem:vantagem@127.0.0.1:5432/vantagem_e2e
      DATABASE_SSL: 'false'
      CORS_ORIGINS: http://127.0.0.1:5174
      FRONTEND_URL: http://127.0.0.1:5174
      CSRF_SECRET: e2e-csrf-secret-hardening
      LOG_LEVEL: warn
      ADMIN_EMAIL: admin@e2e.vantagem.test
      ADMIN_PASSWORD: E2eAdminPass99
      LOJA_IBAN: AO06004400001234567890123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Backend prepare
        working-directory: backend
        run: |
          npm ci
          npm run build
          node dist/db/prestart.js
          npm run seed:e2e
      - name: Frontend deps
        working-directory: frontend
        run: npm ci
      - name: E2E deps + Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: e2e
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results
          retention-days: 7
