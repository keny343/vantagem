# Blueprint for Render. Open:
# https://dashboard.render.com/blueprint/new?repo=https://github.com/keny343/vantagem
#
# DATABASE_URL: paste your Aiven Postgres URI (SSL).
# CORS_ORIGINS: set after the Vercel URL exists, then redeploy.

services:
  - type: web
    name: vantagem-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_COOKIE_NAME
        value: vantagem_session
      - key: LOG_LEVEL
        value: info
