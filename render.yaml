services:
  - type: web
    name: vantagem-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_COOKIE_NAME
        value: vantagem_session
      - key: LOG_LEVEL
        value: info
