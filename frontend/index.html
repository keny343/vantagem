<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0f12" />
    <meta
      name="description"
      content="Vantagem — loja de electrónica em Angola. Portáteis, telemóveis e periféricos com preços em Kwanzas, IVA incluído, transferência bancária e confirmação pela loja."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://vantagem-one.vercel.app/" />
    <title>Vantagem · Electrónica em Angola</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('vantagem-tema');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t === 'light' ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
